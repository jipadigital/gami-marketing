<!--
  ============================================================
  GÂMI DASHBOARD — Broches PNG Completo
  Categorias: Senioridade + Setores + Cidades
  ============================================================
  ESTRUTURA DE PASTAS NECESSÁRIA:

  /img/broches/
    ├── senioridade/
    │     ├── junior-1.png
    │     ├── junior-2.png
    │     ├── junior-3.png
    │     ├── pleno-1.png
    │     ├── pleno-2.png
    │     ├── pleno-3.png
    │     ├── senior-1.png
    │     ├── senior-2.png
    │     ├── senior-3.png
    │     └── gerente.png
    ├── setores/
    │     ├── marketing.png
    │     └── comercial.png
    └── cidades/
          ├── maceio.png
          ├── cuiaba.png
          ├── fortaleza.png
          ├── vitoria.png
          ├── sao-luis.png
          ├── joao-pessoa.png
          ├── recife.png
          ├── teresina.png
          ├── natal.png
          ├── aracaju.png
          └── campo-grande.png

  Caminho base no <script>: ajuste BROCHE_BASE_PATH se necessário.

  Como usar:
  1. Cole o <style> dentro do <head>
  2. Cole o HTML onde os broches devem aparecer
  3. Cole o <script> antes do </body>

  Tudo prefixado com .gx- para evitar conflitos.
  ============================================================
-->


<!-- ============ COLE ISTO NO <head> ============ -->
<style>
.gx-section { margin-bottom: 24px; }

.gx-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #6b7280;
  margin-bottom: 12px;
  text-transform: uppercase;
}

.gx-sublabel {
  font-size: 11px;
  font-weight: 700;
  color: #9ca3af;
  margin: 8px 0 8px;
  letter-spacing: 0.5px;
}

.gx-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* Broche — botão circular com PNG de fundo */
.gx-broche {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  border: none;
  padding: 0;
  cursor: pointer;
  background-color: transparent;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  position: relative;
  transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
  /* Estado padrão: desbotado (não selecionado) */
  filter: grayscale(0.6) brightness(0.85);
  opacity: 0.7;
}

.gx-broche:hover {
  transform: translateY(-2px) scale(1.04);
  filter: grayscale(0) brightness(1);
  opacity: 1;
}

.gx-broche.active {
  filter: grayscale(0) brightness(1);
  opacity: 1;
  transform: scale(1.06);
  box-shadow:
    0 0 0 3px white,
    0 0 0 5px #1d4ed8,
    0 4px 12px rgba(0,0,0,0.25);
}

/* Tooltip com nome ao hover */
.gx-broche::before {
  content: attr(aria-label);
  position: absolute;
  bottom: -28px;
  left: 50%;
  transform: translateX(-50%);
  background: #1f2937;
  color: white;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
  z-index: 10;
}
.gx-broche:hover::before { opacity: 1; }

/* Tamanho responsivo opcional — 70px em telas pequenas */
@media (max-width: 600px) {
  .gx-broche { width: 70px; height: 70px; }
}
</style>


<!-- ============ COLE ISTO ONDE OS BROCHES DEVEM APARECER ============ -->

<!-- NÍVEL / SENIORIDADE -->
<div class="gx-section">
  <div class="gx-label">Nível / Senioridade</div>

  <div class="gx-sublabel">Júnior</div>
  <div class="gx-grid">
    <button type="button" class="gx-broche" aria-label="Júnior I"   data-group="nivel" data-value="Júnior I"   data-img="senioridade/junior-1.png"></button>
    <button type="button" class="gx-broche" aria-label="Júnior II"  data-group="nivel" data-value="Júnior II"  data-img="senioridade/junior-2.png"></button>
    <button type="button" class="gx-broche" aria-label="Júnior III" data-group="nivel" data-value="Júnior III" data-img="senioridade/junior-3.png"></button>
  </div>

  <div class="gx-sublabel">Pleno</div>
  <div class="gx-grid">
    <button type="button" class="gx-broche" aria-label="Pleno I"   data-group="nivel" data-value="Pleno I"   data-img="senioridade/pleno-1.png"></button>
    <button type="button" class="gx-broche" aria-label="Pleno II"  data-group="nivel" data-value="Pleno II"  data-img="senioridade/pleno-2.png"></button>
    <button type="button" class="gx-broche" aria-label="Pleno III" data-group="nivel" data-value="Pleno III" data-img="senioridade/pleno-3.png"></button>
  </div>

  <div class="gx-sublabel">Sênior</div>
  <div class="gx-grid">
    <button type="button" class="gx-broche" aria-label="Sênior I"   data-group="nivel" data-value="Sênior I"   data-img="senioridade/senior-1.png"></button>
    <button type="button" class="gx-broche" aria-label="Sênior II"  data-group="nivel" data-value="Sênior II"  data-img="senioridade/senior-2.png"></button>
    <button type="button" class="gx-broche" aria-label="Sênior III" data-group="nivel" data-value="Sênior III" data-img="senioridade/senior-3.png"></button>
  </div>

  <div class="gx-sublabel">Liderança</div>
  <div class="gx-grid">
    <button type="button" class="gx-broche" aria-label="Gerente" data-group="nivel" data-value="Gerente" data-img="senioridade/gerente.png"></button>
  </div>

  <input type="hidden" id="gx-input-nivel" name="nivel_senioridade" value="">
</div>

<!-- SETOR -->
<div class="gx-section">
  <div class="gx-label">Setor</div>
  <div class="gx-grid">
    <button type="button" class="gx-broche" aria-label="Marketing" data-group="setor" data-value="Marketing" data-img="setores/marketing.png"></button>
    <button type="button" class="gx-broche" aria-label="Comercial" data-group="setor" data-value="Comercial" data-img="setores/comercial.png"></button>
  </div>

  <input type="hidden" id="gx-input-setor" name="setor" value="">
</div>

<!-- CIDADE DE ATUAÇÃO -->
<div class="gx-section">
  <div class="gx-label">Cidade de Atuação</div>
  <div class="gx-grid">
    <button type="button" class="gx-broche" aria-label="Maceió"       data-group="cidade" data-value="Maceió"       data-img="cidades/maceio.png"></button>
    <button type="button" class="gx-broche" aria-label="Cuiabá"       data-group="cidade" data-value="Cuiabá"       data-img="cidades/cuiaba.png"></button>
    <button type="button" class="gx-broche" aria-label="Fortaleza"    data-group="cidade" data-value="Fortaleza"    data-img="cidades/fortaleza.png"></button>
    <button type="button" class="gx-broche" aria-label="Vitória"      data-group="cidade" data-value="Vitória"      data-img="cidades/vitoria.png"></button>
    <button type="button" class="gx-broche" aria-label="São Luís"     data-group="cidade" data-value="São Luís"     data-img="cidades/sao-luis.png"></button>
    <button type="button" class="gx-broche" aria-label="João Pessoa"  data-group="cidade" data-value="João Pessoa"  data-img="cidades/joao-pessoa.png"></button>
    <button type="button" class="gx-broche" aria-label="Recife"       data-group="cidade" data-value="Recife"       data-img="cidades/recife.png"></button>
    <button type="button" class="gx-broche" aria-label="Teresina"     data-group="cidade" data-value="Teresina"     data-img="cidades/teresina.png"></button>
    <button type="button" class="gx-broche" aria-label="Natal"        data-group="cidade" data-value="Natal"        data-img="cidades/natal.png"></button>
    <button type="button" class="gx-broche" aria-label="Aracaju"      data-group="cidade" data-value="Aracaju"      data-img="cidades/aracaju.png"></button>
    <button type="button" class="gx-broche" aria-label="Campo Grande" data-group="cidade" data-value="Campo Grande" data-img="cidades/campo-grande.png"></button>
  </div>

  <input type="hidden" id="gx-input-cidade" name="cidade_atuacao" value="">
</div>


<!-- ============ COLE ISTO ANTES DO </body> ============ -->
<script>
(function(){
  // Caminho base para os PNGs — ajuste se sua estrutura for diferente
  const BROCHE_BASE_PATH = '/img/broches/';

  // Aplicar background-image em cada broche
  document.querySelectorAll('.gx-broche[data-img]').forEach(btn => {
    btn.style.backgroundImage = `url('${BROCHE_BASE_PATH}${btn.dataset.img}')`;
  });

  // Single-select por grupo
  document.querySelectorAll('.gx-broche[data-group]').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.dataset.group;
      const value = btn.dataset.value;

      document.querySelectorAll('[data-group="'+group+'"]').forEach(b => {
        b.classList.remove('active');
      });
      btn.classList.add('active');

      const input = document.getElementById('gx-input-' + group);
      if (input) input.value = value;

      // Evento custom para integração com o resto do dashboard
      document.dispatchEvent(new CustomEvent('gx:change', {
        detail: { group: group, value: value }
      }));
    });
  });

  // Helper para pré-selecionar (útil ao editar pessoa)
  window.gxSetSelection = function(group, value) {
    const btn = document.querySelector(
      '[data-group="'+group+'"][data-value="'+value+'"]'
    );
    if (btn) btn.click();
  };
})();
</script>
