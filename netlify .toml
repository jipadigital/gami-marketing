# netlify.toml - Configuração Gâmi Dashboard
# v4 - 02/06/2026 - Adicionado sync diário Machine→Supabase

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# ============================================================
# REDIRECTS - ORDEM IMPORTA!
# Functions PRIMEIRO, depois SPA catch-all
# ============================================================

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================
# CRON JOBS — Scheduled Functions
# ============================================================

# Stories automáticos (v2 - lógica por dia da semana)
[functions."scheduled-stories"]
  schedule = "0,30 10,15,19,21,22 * * *"

# Posts agendados (Cowork)
[functions."posts-cron"]
  schedule = "*/15 * * * *"

# Sync diário Machine→Supabase (6h UTC = 3h Brasília)
[functions."sync-diario-background"]
  schedule = "0 6 * * *"
