# netlify.toml - Configuração Gâmi Dashboard
# v7 - 02/06/2026 - Adicionado backup DIÁRIO operacional

[build]
  publish = "."
  functions = "netlify/functions"
  # Minifica/ofusca o HTML publicado (a fonte no git continua legível). Ver build-minify.mjs.
  command = "node build-minify.mjs"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# ============================================================
# HEADERS DE SEGURANÇA
# ============================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=(self), usb=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# ============================================================
# REDIRECTS
# ============================================================

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SEGURANÇA (auditoria 13/11/2026): o site publica a RAIZ do repositório, então o código
# das functions (/netlify/...), os SQL e listas de /docs e os arquivos de build ficavam
# baixáveis por qualquer pessoa. Estas regras respondem 404 no lugar do arquivo
# (force = true vale mesmo com o arquivo existindo). As functions de verdade ficam em
# /.netlify/functions/ (com ponto) e NÃO são afetadas. /data, /icons, /img, /stories e
# /broches-gami continuam servidos porque o painel usa.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/build-minify.mjs"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# CRM Pro servido pela MESMA ORIGEM do dashboard (proxy p/ o app gami-crm, que roda
# sob basePath /crmpro). Assim o cookie de sessão do CRM é first-party e funciona
# dentro do iframe até no Safari/iOS. Tem que vir ANTES do catch-all /* abaixo.
[[redirects]]
  from = "/crmpro/*"
  # 13/11/2026: o site do CRM foi renomeado no Netlify (era cerulean-monstera-3f332f).
  # Se renomear de novo, ESTE endereço precisa mudar junto, senão o /crmpro cai (404).
  to = "https://crmgamidelivery.netlify.app/crmpro/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================
# CRON JOBS — Scheduled Functions
# ============================================================

# Stories automáticos
[functions."scheduled-stories"]
  schedule = "0,30 10,15,19,21,22 * * *"

# Posts agendados (Cowork)
[functions."posts-cron"]
  schedule = "*/15 * * * *"

# Sync diário Machine→Supabase (6h UTC = 3h Brasília)
[functions."sync-diario-background"]
  schedule = "0 6 * * *"

# 💾 BACKUP DIÁRIO operacional (8h UTC = 5h Brasília)
# Snapshot completo: pessoas, tarefas, configurações, blog, ranking, etc
[functions."backup-diario-background"]
  schedule = "0 8 * * *"

# 🛡️ Backup DIÁRIO do financeiro (10h UTC = 7h Brasília) -> bucket privado fin-backups
[functions."financeiro-backup-background"]
  schedule = "0 10 * * *"

# 🔔 Push de compromissos com o app fechado (13/11/2026): estava pronto mas sem agendador.
# A cada 2 minutos confere os lembretes vencidos e manda o push.
[functions."push-enviar"]
  schedule = "*/2 * * * *"

# Backup semanal de contagens (domingos 7h UTC = 4h Brasília)
[functions."backup-semanal-background"]
  schedule = "0 7 * * 0"
