[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Aumenta limite de payload pra uploads de mídia (até 6MB no plano free)
[functions]
  node_bundler = "esbuild"

# Functions com payload maior pra upload de imagens/vídeos
[functions."posts-upload"]
  included_files = []

# Scheduled Function: roda a cada 15 minutos pra publicar posts pendentes
# (o schedule também é definido dentro do código com schedule('*/15 * * * *', ...))
