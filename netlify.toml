# netlify.toml - Configuração do site Gâmi Marketing
# Arquivo na raiz do repositório

[build]
  publish = "."
  functions = "netlify/functions"

# Função agendada — posta Stories Instagram automaticamente
# Horário do Netlify Scheduled Functions é UTC.
# Brasília (BRT) = UTC -3h
#   08:00 BRT = 11:00 UTC
#   12:00 BRT = 15:00 UTC
#   16:30 BRT = 19:30 UTC
#   19:00 BRT = 22:00 UTC
[functions."scheduled-stories"]
  schedule = "0,30 11,15,19,22 * * *"
  # Roda às :00 e :30 de cada hora alvo
  # A função interna verifica se é horário correto (tolerância 10min)

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
