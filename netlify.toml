[build]
  publish = "."
  functions = "netlify/functions"
  # SUPABASE_URL e SUPABASE_KEY (publishable) são PÚBLICAS por design — vivem no
  # index.html pro Cloud Mirror funcionar e estão protegidas por RLS no Supabase.
  # Marcar elas como "secret" no Netlify foi conservador demais; aqui dizemos
  # ao secrets scanner pra ignorá-las.
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_KEY"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Aumenta limite de payload pra uploads de mídia (até 6MB no plano free)
[functions]
  node_bundler = "esbuild"

# Scheduled Function: roda a cada 15 minutos pra publicar posts pendentes
[functions."posts-cron"]
  schedule = "*/15 * * * *"
