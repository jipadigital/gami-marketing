# netlify.toml - Configuração do site Gâmi Marketing
# Arquivo na raiz do repositório

[build]
  publish = "."
  functions = "netlify/functions"

# ============================================================
# CRON 1 — Posts Instagram agendados (sistema Cowork)
# Roda a cada 15 minutos
# Verifica posts pendentes em posts_agendados
# Publica via posts-publicar.js
# ============================================================
[functions."posts-cron"]
  schedule = "*/15 * * * *"

# ============================================================
# CRON 2 — Stories automáticos (sistema novo)
# Roda 4× por dia em horários de Brasília:
#   08:00 BRT = 11:00 UTC
#   12:00 BRT = 15:00 UTC
#   16:30 BRT = 19:30 UTC
#   19:00 BRT = 22:00 UTC
# Função interna verifica horário e cria agendamento em posts_agendados
# Não publica direto — usa o pipeline existente do Cowork
# ============================================================
[functions."stories-scheduler"]
  schedule = "0,30 11,15,19,22 * * *"

# ============================================================
# Redirect catch-all (SPA)
# ============================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
