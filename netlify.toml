# netlify.toml - Configuração Gâmi Dashboard
# v7 - 02/06/2026 - Adicionado backup DIÁRIO operacional

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# ============================================================
# HEADERS DE SEGURANÇA
# ============================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), usb=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# ============================================================
# REDIRECTS
# ============================================================

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================
# CRON JOBS — Scheduled Functions
# ============================================================

# Stories automáticos
[functions."scheduled-stories"]
  schedule = "0,30 10,15,19,21,22 * * *"

# Posts agendados (Cowork)
[functions."posts-cron"]
  schedule = "*/15 * * * *"

# Sync diário Machine→Supabase (6h UTC = 3h Brasília)
[functions."sync-diario-background"]
  schedule = "0 6 * * *"

# 💾 BACKUP DIÁRIO operacional (8h UTC = 5h Brasília)
# Snapshot completo: pessoas, tarefas, configurações, blog, ranking, etc
[functions."backup-diario-background"]
  schedule = "0 8 * * *"

# Backup semanal de contagens (domingos 7h UTC = 4h Brasília)
[functions."backup-semanal-background"]
  schedule = "0 7 * * 0"
